# .github/workflows/ci.yml — Formatting, linting, type checks, Django system
# checks, and the Python test suite, all via tox.
#
# Every job runs the same tox envs a developer runs locally, so CI and local
# cannot drift. The `pull_request` trigger is deliberately NOT path-filtered:
# once a job context is a required status check, a path filter means it never
# reports on PRs outside its paths and they sit at "Expected" forever. The
# `push` trigger is unfiltered for the same reason — a commit on main is a
# release candidate, and a check that was never scheduled can never report.

name: Python / Django

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job gets a read-only token unless it
# overrides this with a narrower or wider scope.
permissions:
  contents: read

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    strategy:
      # Keep going, so one red linter does not hide the state of the others.
      fail-fast: false
      matrix:
        toxenv: [fmt, lint, djangofmt, mypy]
    env:
      TOXENV: ${{ matrix.toxenv }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create .env
        run: |
          echo "SECRET_KEY=ci-test-secret-key" > .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env

      - name: Install and run tox
        run: |
          pip install tox tox-uv
          tox

  checks:
    name: Run Django checks
    runs-on: ubuntu-latest
    env:
      TOXENV: django-checks

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create .env
        run: |
          echo "SECRET_KEY=ci-test-secret-key" > .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env

      - name: Install and run tox
        run: |
          pip install tox tox-uv
          tox

  test:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      TOXENV: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create .env
        run: |
          echo "SECRET_KEY=ci-test-secret-key" > .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env

      - name: Install and run tox
        run: |
          pip install tox tox-uv
          tox
