# .github/dependabot.yml — Keep GitHub Actions, the uv-locked Python
# toolchain, and the npm dev tree current.
#
# Third-party actions in .github/workflows/ are pinned to immutable commit
# SHAs (with a `# vX.Y.Z` comment recording the human-readable version) so a
# moved upstream tag cannot execute new code in CI unreviewed. Dependabot's
# github-actions ecosystem updates both the SHA and the comment, which is how
# those pins stay current without hand-maintenance.
#
# Every tox env installs from uv.lock, so the lock is the single place a stale
# Python tool or runtime pin can hide.
#
# Patch and minor bumps are collapsed into one grouped PR per ecosystem per
# week. Majors are excluded from the group and open one PR each, because a
# major can pass CI and still change behaviour.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-patch-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      js-patch-minor:
        update-types:
          - "minor"
          - "patch"
