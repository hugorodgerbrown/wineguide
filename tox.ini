; tox.ini — the single entrypoint for tests, linting and type checks.
;
; CI and local runs both go through tox, so the two cannot drift. Every env
; that needs project dependencies installs them from uv.lock via the
; uv-venv-lock-runner with `--frozen`, so a stale lock fails the run instead
; of being silently re-resolved.

[tox]
no_package = True
envlist =
    fmt, lint, djangofmt, mypy,
    django-checks,
    test,
    js

[testenv:test]
description = Run tests with coverage
runner = uv-venv-lock-runner
dependency_groups = test
uv_sync_flags =
    --frozen
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
commands =
    pytest -n auto --cov=apps --cov=config tests/

[testenv:django-checks]
description = Django system checks and missing migrations
runner = uv-venv-lock-runner
dependency_groups = test
uv_sync_flags =
    --frozen
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
commands =
    python manage.py check --fail-level WARNING
    python manage.py makemigrations --dry-run --check --verbosity 3

[testenv:fmt]
description = Python source code formatting (ruff format)
; ruff's version lives in one place — pyproject.toml's `lint` dependency group
; / uv.lock — and is kept in lockstep with .pre-commit-config.yaml's
; ruff-pre-commit rev. A floating version here is how CI and the local hook
; drift apart.
runner = uv-venv-lock-runner
dependency_groups = lint
uv_sync_flags =
    --frozen
commands =
    ruff format --check .

[testenv:lint]
description = Python source code linting and import sorting (ruff)
runner = uv-venv-lock-runner
dependency_groups = lint
uv_sync_flags =
    --frozen
commands =
    ruff check .

[testenv:djangofmt]
description = Django template formatting (djangofmt) — CI backstop for the bypassable pre-commit hook
runner = uv-venv-lock-runner
dependency_groups = lint
uv_sync_flags =
    --frozen
allowlist_externals = git
; djangofmt has no --check/--diff mode (0.2.x); format in place, then fail if
; anything changed. Note the consequence locally: `git diff` sees unstaged work
; too, so this env reports a failure whenever the tree is dirty. On a clean CI
; checkout it means exactly what it says — a template was not formatted.
commands =
    ; Directories, not a glob: tox passes arguments through without shell
    ; expansion, so apps/*/templates arrives literally and djangofmt errors
    ; on a path that does not exist. Walking apps/ finds every app's
    ; templates and keeps working as apps are added.
    djangofmt {toxinidir}/templates {toxinidir}/apps
    git -C {toxinidir} diff --exit-code

[testenv:mypy]
description = Python source code type hints (mypy)
runner = uv-venv-lock-runner
dependency_groups = type
uv_sync_flags =
    --frozen
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
commands =
    mypy apps/ config/ tests/

[testenv:js]
description = JS unit tests (Vitest/jsdom) — in the default envlist
skip_install = True
allowlist_externals = npm
; Fast and deterministic, so it belongs in the common local `tox` loop
; (unlike e2e, which stays CI-and-on-demand only).
commands =
    npm ci
    npm run test:js

[testenv:e2e]
description = End-to-end browser tests (Playwright/Chromium) — opt-in, not in the default envlist
runner = uv-venv-lock-runner
dependency_groups = e2e
uv_sync_flags =
    --frozen
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
    ; Playwright's async internals can leave a running event loop when
    ; pytest-django creates the test database, tripping Django's
    ; SynchronousOnlyOperation guard. The live-server thread is already
    ; isolated from the test thread, so relaxing it is safe here.
    DJANGO_ALLOW_ASYNC_UNSAFE = true
; npx is needed for the Tailwind build below — static/css/output.css is a
; gitignored artefact, so tox must build it rather than trust whatever copy
; happens to be on disk.
allowlist_externals =
    npx
commands_pre =
    ; Build the stylesheet before the live server starts serving statics. A
    ; stale or missing output.css fails any test that clicks a control whose
    ; position depends on it — Playwright's actionability check sees an
    ; element that is not where the test expects.
    npx @tailwindcss/cli -i ./src/css/main.css -o ./static/css/output.css --minify
    ; Chromium only — no `--with-deps`, which shells out to apt on every
    ; invocation and is a no-op on macOS. The ubuntu-latest runner image
    ; already ships Chromium's shared libraries.
    playwright install chromium
commands =
    pytest {posargs:tests/e2e/} --no-cov -n 2

[testenv:audit]
; The RUNTIME gate, deliberately scoped to --no-dev so an advisory in a
; linter can never block a production release. Dev-group coverage lives in
; `audit-dev`, which is reported separately and is not a required check.
description = Check for known CVEs in pinned runtime dependencies (pip-audit)
skip_install = True
allowlist_externals = uv
deps =
    pip-audit
commands =
    uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file {envtmpdir}/requirements.txt
    pip-audit --requirement {envtmpdir}/requirements.txt

[testenv:audit-dev]
; Detection-only coverage of everything the runtime gate cannot see: the dev
; dependency groups and the npm tree. Fails loudly so a finding is visible,
; but must never gate a merge or a release.
;
; Ignored advisories — each needs a reason AND a removal condition. A bare
; ignore with no exit criterion is how a permanently-red check turns into
; background noise nobody reads.
;
;   PYSEC-2026-3481 / -3482 / -3483 — mcp 1.23.3, present only as a
;     transitive dependency of semgrep (`uv tree --package mcp --invert`).
;     Fixed upstream in mcp 1.27.2 / 1.28.1, but semgrep 1.172.0 requires
;     `mcp==1.23.3` exactly, so there is no resolvable fix on our side. mcp is
;     never imported by application code or tests. REMOVE all three as soon as
;     a semgrep release relaxes that pin — re-check with:
;       curl -s https://pypi.org/pypi/semgrep/json | grep -o 'mcp==[0-9.]*'
;     Added 2026-08-12.
description = Detection-only CVE scan of the dev dependency groups and the npm tree
skip_install = True
allowlist_externals =
    uv
    npm
deps =
    pip-audit
commands =
    uv export --frozen --no-emit-project --no-hashes --format requirements-txt --output-file {envtmpdir}/requirements-all.txt
    pip-audit --requirement {envtmpdir}/requirements-all.txt \
        --ignore-vuln PYSEC-2026-3481 \
        --ignore-vuln PYSEC-2026-3482 \
        --ignore-vuln PYSEC-2026-3483
    ; --package-lock-only audits straight from package-lock.json, so this
    ; needs neither `npm ci` nor a node_modules tree in CI.
    npm audit --package-lock-only --audit-level=low

[testenv:sast]
description = Static analysis (semgrep) — Django + Python rulesets
runner = uv-venv-lock-runner
dependency_groups = sast
uv_sync_flags =
    --frozen
skip_install = True
; The semgrep PACKAGE is pinned by uv.lock like every other tool. Its RULESETS
; (--config=p/…) are deliberately NOT pinned — they are fetched live on every
; run. For a security scanner a freshly-published rule is a newly-detected
; vulnerability class, so live rules are the point.
;
; Excluded rules (high false-positive rate on idiomatic Django):
;   * generic var-in-href — fires on every href="{{ url }}" even when the
;     value is the output of {% url 'name' %} (server-derived).
;   * template-blocktranslate-no-escape — fires on every {% blocktranslate %}.
;     The premise is a malicious translator, and the suggested mitigation
;     (|force_escape on interpolated values) does not satisfy the pattern
;     anyway. Revisit if translations ever come from outside the repository.
commands =
    semgrep --config=p/django --config=p/python --config=p/security-audit \
        --exclude-rule=generic.html-templates.security.var-in-href.var-in-href \
        --exclude-rule=python.django.security.audit.xss.template-blocktranslate-no-escape.template-blocktranslate-no-escape \
        --error --quiet \
        --exclude=.venv --exclude=node_modules --exclude=.claude \
        --exclude=migrations \
        .
